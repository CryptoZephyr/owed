name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: APIMatic PayPal SDK is built and loads
        run: node --input-type=module -e "const m = await import('paypal'); new m.PaypalClient({}); console.log('paypal SDK loaded from', import.meta.resolve('paypal'));"
      - run: npm run build
      - run: npm run typecheck
